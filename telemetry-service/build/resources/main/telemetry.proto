syntax = "proto3";

option java_multiple_files = true;
option java_package = "satellite.telemetry";

package telemetry;

message TelemetryRequest {
  string constellation_name = 1;
}

message TelemetryUpdate {
  string  satellite_name = 1;
  double internal_temp = 2;
  double external_temp = 3;
  double battery_level = 4;
}

service TelemetryService {
  rpc StreamTelemetry(TelemetryRequest) returns (stream TelemetryUpdate);
}