services:
  db:
    image: postgres:15-alpine
    container_name: satellite-db
    environment:
      - POSTGRES_DB=spacedb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Soadsvanpjz228123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spacedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - satellite-network

  redis:
    image: redis:7.2-alpine
    container_name: satellite-cache-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always


  satellite-group:
    build:
      context: ./SatelliteGroup
      dockerfile: Dockerfile
    container_name: space-server
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      telemetry-service:
        condition: service_started
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/spacedb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Soadsvanpjz228123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - satellite-network

  telemetry-service:
    build: ./telemetry-service
    container_name: telemetry-service
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/spacedb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Soadsvanpjz228123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "9091:9091"
    networks:
      - satellite-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - satellite-network

volumes:
  redis_data:

networks:
  satellite-network:
    driver: bridge
