services:
  db:
    image: postgres:15-alpine
    container_name: satellite-db
    environment:
      - POSTGRES_DB=spacedb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Soadsvanpjz228123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spacedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - satellite-network

  satellite-group:
    build:
      context: ./SatelliteGroup
      dockerfile: Dockerfile
    container_name: space-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/spacedb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Soadsvanpjz228123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - satellite-network

  telemetry-service:
    build: ./telemetry-service
    container_name: telemetry-service
    ports:
      - "9091:9091"
    networks:
      - satellite-network

networks:
  satellite-network:
    driver: bridge
